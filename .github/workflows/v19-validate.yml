name: Validate Android v1.11
on:
  push:
    branches: [feat/android-app, main, fix/native-track-replay, fix/reference-upload-export-bundle]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:native
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Generate ephemeral validation signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/passengercount-validation.jks" -storepass validation123 -keypass validation123 -alias passengercount -keyalg RSA -keysize 2048 -validity 30 -dname "CN=PassengerCount validation"
      - name: Build Android APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/passengercount-validation.jks
          SIGNING_STORE_PASSWORD: validation123
          SIGNING_KEY_PASSWORD: validation123
          SIGNING_KEY_ALIAS: passengercount
        run: bash android/build.sh
      - name: Build test-only Android lifecycle instrumentation
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/passengercount-validation.jks
          SIGNING_STORE_PASSWORD: validation123
          SIGNING_KEY_PASSWORD: validation123
          SIGNING_KEY_ALIAS: passengercount
        run: bash scripts/build-android-tests.sh
      # Public GitHub-hosted Ubuntu 24.04 VMs support accelerated Android emulators.
      # Give only the current ephemeral runner user rw on an existing KVM device;
      # never chmod 0666, create a fake device, or request software emulation.
      - name: Diagnose KVM and grant runner-only access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/build/lifecycle-evidence
          {
            printf 'Runner OS=%s arch=%s environment=%s\\n' "${RUNNER_OS:-unset}" "${RUNNER_ARCH:-unset}" "${RUNNER_ENVIRONMENT:-unset}"
            id
            if [[ "${CI:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${RUNNER_ARCH:-}" != X64 ]]; then
              echo 'KVM_RUNNER_UNSUPPORTED: expected disposable GitHub-hosted Linux x64 VM'
              exit 2
            fi
            if [[ ! -e /dev/kvm ]]; then
              echo 'KVM_DEVICE_MISSING: this runner has no /dev/kvm'
              exit 2
            fi
            if [[ ! -c /dev/kvm ]]; then
              echo 'KVM_NOT_CHARACTER_DEVICE: refusing to change the device'
              exit 2
            fi
            stat -c 'KVM before: type=%F owner=%U group=%G mode=%a' /dev/kvm
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              if ! command -v setfacl >/dev/null 2>&1; then
                echo 'KVM_ACL_TOOL_MISSING: runner image lacks setfacl'
                exit 2
              fi
              if ! sudo -n setfacl -m "u:$(id -un):rw" /dev/kvm; then
                echo 'KVM_ACL_GRANT_FAILED: could not grant only the runner user rw'
                exit 2
              fi
            fi
            stat -c 'KVM after: type=%F owner=%U group=%G mode=%a' /dev/kvm
            if command -v getfacl >/dev/null 2>&1; then getfacl -cp /dev/kvm; fi
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              echo 'KVM_ACCESS_DENIED: access still absent after attempted grant'
              exit 2
            fi
            echo 'KVM_ACCESS_READY: device is readable/writable; emulator -accel-check still required'
          } 2>&1 | tee android/build/lifecycle-evidence/kvm-access.txt
      - name: Validate installed journal lifecycle on API35
        timeout-minutes: 12
        run: bash scripts/test-android-installed.sh
      - name: Preserve installed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PassengerCount-API35-lifecycle-${{ github.sha }}
          path: android/build/lifecycle-evidence
          if-no-files-found: warn
      - name: Include signing utility for local production re-sign
        run: |
          mkdir -p android/build/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android/build/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/build/signing-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: PassengerCount-1.11-validation
          path: |
            android/build/PassengerCount.apk
            android/build/aligned.apk
            android/build/signing-tools
          if-no-files-found: error

