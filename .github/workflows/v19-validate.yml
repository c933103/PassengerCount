name: Validate Android v1.10
on:
  push:
    branches: [feat/android-app, fix/reference-upload-export-bundle]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Generate ephemeral validation signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/passengercount-validation.jks" -storepass validation123 -keypass validation123 -alias passengercount -keyalg RSA -keysize 2048 -validity 30 -dname "CN=PassengerCount validation"
      - name: Build Android APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/passengercount-validation.jks
          SIGNING_STORE_PASSWORD: validation123
          SIGNING_KEY_PASSWORD: validation123
          SIGNING_KEY_ALIAS: passengercount
        run: bash android/build.sh
      - name: Include signing utility for local production re-sign
        run: |
          mkdir -p android/build/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android/build/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/build/signing-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: PassengerCount-1.10-validation
          path: |
            android/build/PassengerCount.apk
            android/build/aligned.apk
            android/build/signing-tools
          if-no-files-found: error
